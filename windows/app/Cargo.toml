[package]
name = "juicebar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "JuiceBar for Windows: the tray icon, the flyout, the notices and the hotkey"
build = "build.rs"

[[bin]]
name = "JuiceBar"
path = "src/main.rs"

[[example]]
name = "drive"
path = "examples/drive.rs"

[dependencies]
juicebar-core = { path = "../core" }
juicebar-hid = { path = "../hid" }
juicebar-ui = { path = "../ui" }
windows = { version = "0.62.2", features = [
    "Devices_Power",
    "Foundation",
    "Gaming_Input",
    "System_Power",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
