[package]
name = "juicebar-hid"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "JuiceBar Windows HID transport: HID++ collections of VID 046D, hot plug through CM_Register_Notification, one overlapped I/O thread."

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }
